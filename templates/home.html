<!DOCTYPE html>
<html>
<head>
    <title>Students CRUD</title>

    <!-- Bootstrap (optional but looks good) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="container mt-4">

<h2 class="text-center">Student Management System</h2>

<!-- 🔐 Messages -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!-- 🔍 SEARCH -->
<form method="GET" class="mb-3">
    <input type="text" name="q" class="form-control" placeholder="Search student name">
    <button type="submit" class="btn btn-primary mt-2">Search</button>
</form>

<!-- ➕ ADD FORM -->
<h4>Add Student</h4>
<form method="POST" class="mb-4">
    {% csrf_token %}
    
    <input type="text" name="username" class="form-control mb-2" placeholder="Name">
    <input type="number" name="age" class="form-control mb-2" placeholder="Age">
    <input type="email" name="email" class="form-control mb-2" placeholder="Email">

    <button type="submit" class="btn btn-success">Add</button>
</form>

<!-- 📋 LIST -->
<h4>Student List</h4>

<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    {% for s in data %}
    <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.age }}</td>
        <td>{{ s.email }}</td>

        <td>
            <!-- ✏️ UPDATE -->
            <a href="{% url 'update' s.id %}" class="btn btn-warning btn-sm">Edit</a>

            <!-- ❌ DELETE -->
            <a href="{% url 'delete' s.id %}" class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure?')">
               Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
