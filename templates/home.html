<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Card Hover Style -->
    <style>
        .card:hover {
            transform: scale(1.02);
            transition: 0.2s;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4 text-primary">Saved Names</h2>

    <!-- ✅ MESSAGES -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <!-- 🔍 Search -->
    <form method="GET" class="mb-3">
        <input type="text" name="q" value="{{ request.GET.q }}" 
               class="form-control" placeholder="Search name">
    </form>

    <!-- ➕ Add Name -->
    <form method="POST" class="mb-4">
        {% csrf_token %}

        <label class="form-label">Enter Name:</label>
        <input type="text" name="username" class="form-control" 
               placeholder="Enter name" required autofocus>

        <button type="submit" class="btn btn-primary mt-2">Submit</button>
    </form>

    <hr>

    <!-- 📋 Data Display -->
    {% for i in data %}
        <div class="card p-3 mb-3 shadow-sm border-0 rounded">

            <h5 class="mb-3">{{ i.name }}</h5>

            <div class="d-flex gap-2">
                <a href="{% url 'update' i.id %}" class="btn btn-warning btn-sm">✏️ Edit</a>

                <a href="{% url 'delete' i.id %}" 
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure to delete this name?')">
                   Delete
                </a>
            </div>

        </div>
    {% empty %}
        <div class="alert alert-info text-center">
            No data available
        </div>
    {% endfor %}

</div>

<!-- ✅ Bootstrap JS (must be here) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
